<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Edit Employee</h2>
    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
        <div class="mb-2">
            <label>Full Name:</label>
            <input type="text" th:field="*{fullName}" class="form-control">
        </div>
        <div class="mb-2">
            <label>Email:</label>
            <input type="email" th:field="*{email}" class="form-control" readonly>
        </div>
        <div class="mb-2">
            <label>Phone:</label>
            <input type="text" th:field="*{phone}" class="form-control">
        </div>
        <div class="mb-2">
            <label>Department:</label>
            <input type="text" th:field="*{department}" class="form-control">
        </div>
        <div class="mb-2">
            <label>Salary:</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control">
        </div>
        <button type="submit" class="btn btn-success mt-2">Update Employee</button>
        <a th:href="@{/employees}" class="btn btn-secondary mt-2">Cancel</a>
    </form>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Employee Management System</h2>

    <!-- Search Form -->
    <form th:action="@{/employees}" method="get" class="mb-3 d-flex gap-2">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name...">
        <button type="submit" class="btn btn-secondary">Search</button>
    </form>

    <!-- Add Employee Form -->
    <div class="card p-3 mb-4">
        <h4>Add New Employee</h4>
        <form th:action="@{/employees}" th:object="${employee}" method="post">
            <div class="mb-2">
                <label>Full Name:</label>
                <input type="text" th:field="*{fullName}" class="form-control">
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></span>
            </div>
            <div class="mb-2">
                <label>Email:</label>
                <input type="email" th:field="*{email}" class="form-control">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
            </div>
            <div class="mb-2">
                <label>Phone:</label>
                <input type="text" th:field="*{phone}" class="form-control">
                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
            </div>
            <div class="mb-2">
                <label>Department:</label>
                <input type="text" th:field="*{department}" class="form-control">
                <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="text-danger"></span>
            </div>
            <div class="mb-2">
                <label>Salary:</label>
                <input type="number" step="0.01" th:field="*{salary}" class="form-control">
                <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="text-danger"></span>
            </div>
            <button type="submit" class="btn btn-primary mt-2">Save Employee</button>
        </form>
    </div>

    <!-- Employee Table -->
    <h4>Employee List</h4>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this employee?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
